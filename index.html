<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Countdown</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background-color: #161b22;
            padding: 15px;
            text-align: center;
            font-size: 24px;
            border-bottom: 2px solid #21262d;
        }

        .container {
            padding: 20px;
            max-width: 600px;
            margin: auto;
            text-align: center;
        }

        .card {
            background-color: #161b22;
            border: 1px solid #21262d;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
        }

        .btn {
            display: block;
            width: 100%;
            background-color: #21262d;
            color: #58a6ff;
            padding: 12px;
            margin-top: 10px;
            border: 1px solid #30363d;
            border-radius: 6px;
            font-size: 18px;
            text-decoration: none;
            transition: 0.2s;
        }

        .btn:hover {
            background-color: #30363d;
        }

        #countdown {
            font-size: 28px;
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="navbar">
        Weekly Update Countdown
    </div>

    <div class="container">

        <div class="card">
            <h2>Next Update</h2>
            <div id="countdown">Loading...</div>
        </div>

        <!-- Suggestions button -->
        <a class="btn" href="https://codingiscool464.github.io/suggestions">Suggestions</a>

        <!-- Changelogs button (middle) -->
        <a class="btn" href="https://codingiscool464.github.io/changelogs">Changelogs</a>

        <!-- Back to home button -->
        <a class="btn" href="https://codingiscool464.github.io">Back to Home</a>

    </div>

    <script>
        function getNextFridayAt1PM() {
            const now = new Date();
            const result = new Date();
            
            result.setDate(now.getDate() + ((5 - now.getDay() + 7) % 7)); 
            result.setHours(13, 0, 0, 0);

            if (result < now) {
                result.setDate(result.getDate() + 7);
            }

            return result;
        }

        function updateCountdown() {
            const deadline = getNextFridayAt1PM();
            const now = new Date();
            const diff = deadline - now;

            if (diff <= 0) {
                document.getElementById("countdown").innerHTML = "Update Time!";
                return;
            }

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const minutes = Math.floor((diff / (1000 * 60)) % 60);
            const seconds = Math.floor((diff / 1000) % 60);

            document.getElementById("countdown").innerHTML =
                `${days}d ${hours}h ${minutes}m ${seconds}s`;
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>

</body>
</html>
